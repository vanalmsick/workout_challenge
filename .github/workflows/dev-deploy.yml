name: Development Deployment
on:
  push:
    branches: [ 'dev' ]
    paths-ignore: [ '.github/**', 'docs/**', 'README.md' ]

permissions:
  contents: read

jobs:

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to DockerHub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64/v8,linux/amd64
          push: true
          tags: ${{secrets.DOCKER_USER}}/workout_challenge:dev
          # Reuse BuildKit layers across runs.
          # ignore-error: a rejected cache export (GitHub Actions cache rate
          # limit or quota) must not fail the build - caching is an
          # optimisation, not a requirement.
          cache-from: type=gha
          cache-to: type=gha,mode=min,ignore-error=true
