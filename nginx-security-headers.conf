# Shared security response headers.
#
# WHY THIS IS A SEPARATE FILE:
# nginx's `add_header` is *replace, not merge*. Directives are inherited from an
# outer level ONLY IF the current level defines no `add_header` of its own. So a
# `location` that sets e.g. `add_header Cache-Control ...` silently drops every
# server-level security header. That bug is invisible in testing.
#
# RULE: every `location` block that contains its own `add_header` MUST also
#       `include /etc/nginx/nginx-security-headers.conf;`
#
# `always` makes the headers apply to error responses (4xx/5xx) too, not just 2xx.

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# X-XSS-Protection is deliberately absent: it is deprecated, ignored by modern
# browsers, and its legacy auditor introduced XSS vectors of its own. CSP below
# is the replacement.

add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=()" always;

# CSP notes:
#   script-src 'unsafe-inline'  - CRA inlines its webpack runtime into index.html,
#                                 and the Django admin uses inline handlers.
#                                 Removing this needs a nonce-injection step.
#   connect-src https:          - Sentry ingest + any self-hosted Sentry host.
#                                 Tighten to your actual ingest domain if known.
#   frame-ancestors 'self'      - modern replacement for X-Frame-Options.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

# HSTS is intentionally NOT set here. This server listens on plain HTTP behind a
# TLS-terminating reverse proxy; the correct place for Strict-Transport-Security
# is that proxy. Enabling it here would either be ignored (served over http) or,
# if this container is ever exposed directly, lock the domain to https before a
# certificate exists. Enable at the edge instead:
#   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
