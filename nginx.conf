# Workout Challenge - nginx site config.
# Installed by the Dockerfile to /etc/nginx/http.d/default.conf, i.e. this file
# is included from the stock Alpine `http { ... }` block.
#
# Serves the React SPA build and reverse-proxies /api and /admin to gunicorn.

# ---------------------------------------------------------------------------
# Rate limiting zones (http context)
# ---------------------------------------------------------------------------
# Throttles credential stuffing against login and password reset. 10 MB of
# shared memory holds ~160k client IPs. Deliberately NOT applied to
# /api/token/refresh/ - the SPA refreshes every ~5 minutes (access token TTL)
# and would trip the limiter during normal use.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=reset_limit:10m rate=5r/m;
limit_req_status 429;

# ---------------------------------------------------------------------------
# Backend
# ---------------------------------------------------------------------------
# 127.0.0.1, not "localhost": nginx resolves the hostname once at startup and
# Alpine's /etc/hosts maps localhost to ::1 as well as 127.0.0.1, while gunicorn
# binds 0.0.0.0 (IPv4 only). Picking the v6 record yields intermittent 502s.
upstream django {
    server 127.0.0.1:8000;
    # Reuse upstream connections instead of a fresh TCP handshake per request.
    keepalive 16;
}

server {
    listen 80 default_server;

    # Don't advertise the nginx version in the Server header or on error pages.
    server_tokens off;

    charset utf-8;

    # No FileField/ImageField in the models - all request bodies are JSON.
    client_max_body_size 2m;

    # -----------------------------------------------------------------------
    # Compression
    # -----------------------------------------------------------------------
    # nginx's built-in gzip_types default is `text/html` only, so without this
    # the entire JS/CSS bundle and every API response ship uncompressed.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/rss+xml
        application/wasm
        application/xml
        image/svg+xml
        image/x-icon
        text/css
        text/javascript
        text/plain
        text/xml;

    # -----------------------------------------------------------------------
    # Default security headers
    # -----------------------------------------------------------------------
    # Inherited by any location that does NOT define its own add_header.
    # Locations that DO set add_header must re-include this file - see the
    # explanation at the top of nginx-security-headers.conf.
    include /etc/nginx/nginx-security-headers.conf;

    # -----------------------------------------------------------------------
    # Shared proxy headers
    # -----------------------------------------------------------------------
    # Same replace-not-merge inheritance rule as add_header: if you add a
    # proxy_set_header inside a location, you must repeat ALL of these there.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;

    # -----------------------------------------------------------------------
    # Health check (used by the Dockerfile HEALTHCHECK)
    # -----------------------------------------------------------------------
    # `default_type` rather than `add_header Content-Type`, so this location
    # keeps inheriting the server-level security headers.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # -----------------------------------------------------------------------
    # Backend Django API
    # -----------------------------------------------------------------------
    # Rate-limited auth endpoints first - exact-match (=) locations win over the
    # prefix match on /api/ below, and keep /api/token/refresh/ unthrottled.
    location = /api/token/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://django;
    }

    location = /api/password-reset/request/ {
        limit_req zone=reset_limit burst=3 nodelay;
        proxy_pass http://django;
    }

    location /api/ {
        proxy_pass http://django;
    }

    # -----------------------------------------------------------------------
    # Django admin
    # -----------------------------------------------------------------------
    # Previously missing, so /admin/ fell through to `location /` and returned
    # the React SPA - the admin was only reachable on port 8000 directly.
    location /admin/ {
        proxy_pass http://django;
    }

    # Backend (admin) static files - collectstatic output, STATIC_URL=apistatic/
    location /apistatic/ {
        alias /workout_challenge/src-backend/static/;
        include /etc/nginx/nginx-security-headers.conf;
        # Single Cache-Control source: `expires` emits its own Cache-Control,
        # which would collide with the add_header below and send two of them.
        add_header Cache-Control "public, max-age=432000" always;
        access_log off;
        # No try_files here on purpose: `try_files` combined with `alias` is a
        # long-standing nginx footgun (the URI is appended inconsistently across
        # versions). A missing file under an alias already 404s on its own.
    }

    # -----------------------------------------------------------------------
    # React frontend
    # -----------------------------------------------------------------------
    # Content-hashed CRA bundles - safe to cache forever. A missing asset must
    # 404 rather than fall back to index.html (which would return HTML with a
    # 200 status under a .js URL and produce a confusing MIME-type error).
    location /static/ {
        root /usr/share/nginx/html;
        include /etc/nginx/nginx-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # index.html is the deploy pointer to the hashed bundles: caching it pins
    # users to a stale build. Matched both directly and via the try_files
    # fallback in `location /` (a URI fallback re-enters location matching).
    location = /index.html {
        root /usr/share/nginx/html;
        include /etc/nginx/nginx-security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # config.js is regenerated from container env vars on every nginx start
    # (see supervisord.conf). A cached copy pins a stale Sentry DSN and Strava
    # client ID, which breaks the OAuth link flow after a config change.
    location = /config.js {
        root /usr/share/nginx/html;
        include /etc/nginx/nginx-security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # SPA fallback for client-side routes.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
