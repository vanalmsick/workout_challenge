# Working directory has to be the top directory "workout_challenge" that contains the sub-folders "src-frontend" and "src-backend"

[supervisord]
nodaemon=true

# Supervisord frontend to see status / restart / stop the below processes
[inet_http_server]
port = 9001
priority=100

# Redis sever for caching and celery backend
#
# Memory bounds (redis is otherwise unbounded and grows for the container's whole lifetime):
#   --maxmemory              hard ceiling, override with REDIS_MAXMEMORY (default 256mb)
#   --maxmemory-policy       volatile-lru evicts ONLY keys that carry a TTL. That covers the
#                            Django cache (db1) and celery task results, but deliberately never
#                            the celery broker queues (db0), which have no TTL - evicting those
#                            would silently drop queued tasks. Do NOT change this to allkeys-*.
#   --save ""                disables RDB snapshotting. BGSAVE forks the redis process, and
#                            copy-on-write can transiently double its RSS. Nothing here needs to
#                            survive a container restart (broker + cache only).
[program:redis]
directory=/workout_challenge/src-backend/data
command=sh -c '/usr/bin/redis-server --maxmemory ${REDIS_MAXMEMORY:-256mb} --maxmemory-policy volatile-lru --save ""'
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile_maxbytes=0
autorestart=true
priority=200
stopwaitsecs=20

# Celery for Django for task queuing
[program:celery-worker]
directory=/workout_challenge/src-backend
#
# --max-tasks-per-child / --max-memory-per-child recycle the prefork children. Without them a
# child lives for the container's whole lifetime, so the peak memory of the heaviest task it ever
# ran (strava sync, point recalc) stays resident forever and the process only ever grows.
# --max-memory-per-child is in KiB, so 200000 ~= 200 MB.
command=sh -c 'while ! nc -z localhost 6379 </dev/null; do echo "celery-worker waiting for redis at port :6379"; sleep 3; done && celery -A workout_challenge worker --loglevel INFO --without-mingle --without-gossip --autoscale=4,1 --events --max-tasks-per-child=${CELERY_MAX_TASKS_PER_CHILD:-50} --max-memory-per-child=${CELERY_MAX_MEMORY_PER_CHILD:-200000}'
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile_maxbytes=0
autorestart=true
priority=300
stopwaitsecs=20

# Celery Beat for task scheduling
[program:celery-beat]
directory=/workout_challenge/src-backend
command=sh -c 'while ! nc -z 0.0.0.0 8000 </dev/null; do echo "celery-beat waiting for django at port :8000"; sleep 3; done && celery -A workout_challenge beat --scheduler django_celery_beat.schedulers:DatabaseScheduler --loglevel INFO'
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile_maxbytes=0
autorestart=true
priority=600
stopwaitsecs=20

# Celery Flower as frontend to view task que and task status
[program:celery-flower]
directory=/workout_challenge/src-backend
#
# Flower keeps every task event it has ever seen in RAM (default max_tasks=10000) and, with
# --persistent, mirrors that to disk. On a long-lived container that is a steadily growing
# in-memory dict. Cap the history and drop workers that have gone away.
#
# flower_preflight.py runs first because that on-disk state is a shelve/dbm file living in the
# mounted data/ volume, and flower crashes outright ("dbm.error: db type could not be determined")
# when it cannot identify the file's format - after a mid-write kill, or after a base-image python
# bump that changes the default dbm backend. Flower does not catch that, autorestart=true retries
# it, and the volume keeps the bad file across restarts and rebuilds, so it crash-loops forever.
# The preflight deletes an unreadable state file (task history only) and always exits 0.
command=sh -c 'FLOWER_DB=/workout_challenge/src-backend/data/flower.db; while ! nc -z localhost 6379 </dev/null; do echo "celery-flower waiting for redis at port :6379"; sleep 3; done && python /workout_challenge/src-backend/flower_preflight.py "$FLOWER_DB" && celery -A workout_challenge flower --persistent=True --db="$FLOWER_DB" --max_tasks=${FLOWER_MAX_TASKS:-1000} --purge_offline_workers=120'
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile_maxbytes=0
autorestart=true
priority=400

# Backend Django
#
# --max-requests restarts each gevent worker after N requests (+ jitter so the 3 workers don't all
# recycle at once). Without it the workers are never replaced, so every bit of per-request
# fragmentation and every cached object accumulates for the container's whole lifetime - which is
# the usual reason RSS only ever climbs. --worker-connections caps concurrent greenlets per worker
# (gunicorn's default is 1000), bounding how many in-flight request bodies/responses can coexist.
[program:backend-django]
directory=/workout_challenge/src-backend
command=sh -c 'while ! nc -z localhost 6379 </dev/null; do echo "django gunicorn waiting for redis at port :6379"; sleep 3; done && python manage.py makemigrations && python manage.py migrate && gunicorn workout_challenge.wsgi:application --workers=3 --worker-class=gevent --worker-connections=250 --max-requests=${GUNICORN_MAX_REQUESTS:-1000} --max-requests-jitter=100 --chdir /workout_challenge/src-backend --bind 0.0.0.0:8000 --timeout 120'
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile_maxbytes=0
autorestart=true
priority=500
stopwaitsecs=20

# Nginx proxy for React frontend and backend redirect to gunicorn running Django
[program:nginx]
command=sh -c 'echo "window.RUNTIME_CONFIG = { REACT_APP_SENTRY_DSN: \"${SENTRY_DSN}\", REACT_APP_STRAVA_CLIENT_ID: \"${STRAVA_CLIENT_ID}\" };" > /usr/share/nginx/html/config.js && /usr/sbin/nginx -g "daemon off;"'
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile_maxbytes=0
autorestart=true
priority=700